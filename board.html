<style id="app-css">
:root{
  color-scheme: light;
  --ground:#EDEEF0; --surface:#FFFFFF; --surface-2:#F5F6F7; --sunk:#E4E6E9;
  --ink:#2E3135; --ink-2:#55595E; --muted:#6B7078; --faint:#8A9099;
  --line:#DDE0E3; --line-strong:#B9BDC2;
  --brand:#9B1C28; --brand-deep:#6E1420; --brand-soft:#F6E6E8; --on-brand:#FFFFFF;
  --gold:#C8912B; --gold-ink:#855B10; --gold-soft:#F7EEDB;
  --good:#2F7A4F; --good-soft:#E2F0E7;
  --crit:#9B1C28; --crit-soft:#F6E6E8; --on-ink:#FFFFFF;
  --hex-op:.85;
  --f-title:'Michroma','Eurostile','Microgramma',Arial,sans-serif;
  --f-body:'Saira Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-label:'Saira Condensed','Arial Narrow',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#17191C; --surface:#212428; --surface-2:#282C31; --sunk:#1C1F22;
    --ink:#ECEDEF; --ink-2:#C3C7CC; --muted:#99A0A8; --faint:#7A8088;
    --line:#33373D; --line-strong:#4A4F56;
    --brand:#E0636C; --brand-deep:#B8414B; --brand-soft:#3A2124; --on-brand:#17191C;
    --gold:#D9A441; --gold-ink:#E5B862; --gold-soft:#3A2F1A;
    --good:#5DBB85; --good-soft:#1C3326;
    --crit:#E0636C; --crit-soft:#3A2124; --on-ink:#17191C;
    --hex-op:.06;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#17191C; --surface:#212428; --surface-2:#282C31; --sunk:#1C1F22;
  --ink:#ECEDEF; --ink-2:#C3C7CC; --muted:#99A0A8; --faint:#7A8088;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:13px}
.lbl{font:600 11.5px/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

.appname{margin-top:12px;font:600 11.5px/1.25 var(--f-label);text-transform:uppercase;letter-spacing:.12em;color:var(--brand)}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:1px}
.ng{display:flex;align-items:center;justify-content:space-between;font:600 11px var(--f-label);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);padding:14px 10px 5px}
.ng-add{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:4px;width:20px;height:20px;line-height:1;font-size:14px;padding:0}
.ng-add:hover{border-color:var(--brand);color:var(--brand)}
.nsep{height:1px;background:var(--line);margin:12px 6px 6px}
.ni{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:5px;padding:7px 10px;text-align:left;color:var(--ink-2)}
.ni:hover{background:var(--surface-2);color:var(--ink)}
.ni[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.ni[aria-current="page"] .ni-t{font-weight:700}
.ni-t{font-weight:500;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-s{font:11.5px var(--f-mono);color:var(--faint);white-space:nowrap}
.cnt{font:600 11px/1 var(--f-mono);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:var(--on-brand);display:inline-grid;place-items:center;flex:none}
.cnt.out{background:transparent;color:var(--crit);box-shadow:inset 0 0 0 1.5px var(--crit)}
.cnt.n{background:var(--sunk);color:var(--ink-2)}
.side-foot{margin-top:auto;padding:14px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side-foot select{width:100%}
.savepill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-height:26px;flex-wrap:wrap}
.savepill .dotc{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.savepill.ok .dotc{background:var(--good)} .savepill.dirty .dotc{background:var(--gold)} .savepill.ro .dotc{background:var(--line-strong)}
.mnav{display:none}
.mainarea{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:26px 64px}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mnav{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mnav .shield{width:26px;height:29px}
  .mnav select{flex:1 1 auto;min-width:0}
  .mnav .savepill span{display:none}
}

/* ---------- controls ---------- */
.btn{height:34px;padding:0 14px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:4px;font:600 13.5px var(--f-label);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.block{width:100%;justify-content:center}
.btn.danger{background:transparent;color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{height:34px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:0 10px;min-width:0}
.x{width:26px;height:26px;border:0;background:transparent;color:var(--faint);border-radius:4px;font-size:18px;line-height:1;flex:none;padding:0}
.x:hover{background:var(--crit-soft);color:var(--crit)}
.ib{width:30px;height:30px;border:1px solid var(--line-strong);border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;line-height:1;padding:0;color:var(--ink)}
.ib:hover{border-color:var(--ink)}
.ib.go{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.add-btn{border:1px dashed var(--line-strong);background:transparent;color:var(--ink-2);border-radius:4px;padding:5px 10px;font:600 12.5px var(--f-label);letter-spacing:.05em;text-transform:uppercase}
.add-btn:hover{border-color:var(--brand);color:var(--brand)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* ---------- page header ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.ph h1{font:400 clamp(19px,2.2vw,24px)/1.25 var(--f-title);color:var(--brand);text-transform:uppercase;letter-spacing:.02em;margin:4px 0 0;text-wrap:balance}
.ph .sub{color:var(--muted);margin-top:4px}
.ph-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .d{display:flex;flex-direction:column;line-height:1.2;min-width:170px;text-align:center}
.datenav .d b{font-weight:600;font-size:15.5px}
.datenav .d span{font:12px var(--f-mono);color:var(--muted)}
.icon{width:32px;height:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;font-size:18px;line-height:1;display:grid;place-items:center;flex:none;padding:0}
.icon:hover{border-color:var(--ink)}
.att{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.pchip{font-size:13px;padding:2px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pchip.m{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.pchip.o{border-style:dashed;color:var(--muted)}
.att details{font-size:13px;color:var(--muted)}
.att summary{cursor:pointer}
.att details[open]{flex-basis:100%}
.att details .names{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.pan-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px}
h2{font:700 14px/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.1em;margin:0;color:var(--ink)}
.pan-h .sub{color:var(--muted);font-size:13px}
.pan-h .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.none{color:var(--muted);font-size:14px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{padding:14px 18px;border:0;border-left:1px solid var(--line);background:transparent;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:first-child{border-left:0}
button.kpi:hover{background:var(--surface-2)}
.kpi .n{font:500 30px/1.05 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .l{font:600 11.5px var(--f-label);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.crit .n{color:var(--crit)} .kpi.warn .n{color:var(--gold-ink)} .kpi.good .n{color:var(--good)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

/* overview */
.ovgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;align-items:start}
@media (max-width:1100px){.ovgrid{grid-template-columns:minmax(0,1fr)}}
.att-list{list-style:none;margin:0;padding:0}
.att-list li{border-top:1px solid var(--line)}
.att-list li:first-child{border-top:0}
.att-list button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 4px}
.att-list button:hover{background:var(--surface-2)}
.att-list .t{font-weight:500;overflow-wrap:anywhere}
.att-list .m{grid-column:2;font-size:13px;color:var(--muted)}
.mgroup + .mgroup{margin-top:16px}
.mgroup .lbl{margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mc{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 14px}
.mc:hover{border-color:var(--brand)}
.mc .nm{font-weight:700;font-size:15.5px}
.mc .dt{font:12.5px var(--f-mono);color:var(--muted)}
.mc .ppl{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.mc .row{display:flex;gap:12px;margin-top:2px;padding-top:8px;border-top:1px solid var(--line)}
.mc .row span{display:flex;flex-direction:column;font:600 10.5px var(--f-label);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mc .row b{font:500 16px var(--f-mono);color:var(--ink);letter-spacing:0}
.mc .row b.crit{color:var(--crit)}

/* ---------- meeting: stepper ---------- */
.stepper{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));flex:1 1 auto;min-width:0}
.st{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:9px;align-items:center;text-align:left;border:0;border-right:1px solid var(--line);background:transparent;padding:10px 12px;min-width:0;overflow:hidden}
.st:hover{background:var(--surface-2)}
.st-n{grid-row:1 / span 2;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font:600 12.5px var(--f-mono);color:var(--ink-2)}
.st-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-y{display:none;font-weight:600;font-size:12.5px;white-space:nowrap}
.st-b{font:11.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.st-b b{font-weight:600;color:var(--ink-2)}
.st-p{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold)}
.st.main .st-n{border-color:var(--brand);color:var(--brand)}
.st.cur{background:var(--ink);color:var(--on-ink)}
.st.cur .st-b,.st.cur .st-b b{color:inherit;opacity:.75}
.st.cur .st-n{background:var(--on-ink);border-color:var(--on-ink);color:var(--ink)}
.st.due:not(.cur){box-shadow:inset 0 0 0 2px var(--gold)}
.tmr{display:flex;align-items:center;gap:8px;padding:8px 14px;flex:none;border-left:1px solid var(--line)}
.tmr .t-el{font:500 20px var(--f-mono);font-variant-numeric:tabular-nums}
.tmr .t-of{font:12px var(--f-mono);color:var(--muted)}
.tmr.over .t-el{color:var(--crit)}
.t-hint{font-size:13px;color:var(--muted);margin-top:-8px;padding-left:2px}
.t-hint b{color:var(--ink)}
.t-hint.over b{color:var(--crit)}
@media (max-width:980px){.stepper{flex-direction:column}.steps{grid-template-columns:repeat(5,minmax(0,1fr))}.st{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding:8px 4px}.st-n{grid-row:auto}.st-b{display:none}.tmr{border-left:0;border-top:1px solid var(--line);justify-content:center}}
@media (max-width:980px){.st-t{display:none}.st-y{display:block}}

.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1150px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.stage{min-height:360px;display:flex;flex-direction:column}
.stg-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stg-h .segno{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:600 15px var(--f-mono);flex:none}
.stg-h .tt{flex:1 1 260px;min-width:0}
.stg-h h2{font:400 17px/1.3 var(--f-title);letter-spacing:.02em;color:var(--ink)}
.stg-h .rule{margin:4px 0 0;color:var(--ink-2);font-size:14px;max-width:64ch}
.stg-f{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line)}
.stg-body{padding-bottom:16px}

.rp{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 16px;padding:12px 0;border-top:1px solid var(--line)}
.rp:first-child{border-top:0;padding-top:2px}
.rp-h b{display:block;font-weight:700}
.rp-h span{font-size:12.5px;color:var(--muted)}
.rp-b{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
@media (max-width:640px){.rp{grid-template-columns:minmax(0,1fr)}}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 6px 8px 10px;background:var(--surface-2);border-radius:5px}
.it-t{font-weight:500;overflow-wrap:anywhere}
.why{color:var(--ink-2);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.why span{font:600 11px var(--f-label);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
.why.own span{color:var(--brand)}
.chip{font:700 11px/1 var(--f-label);text-transform:uppercase;letter-spacing:.07em;padding:5px 7px;border-radius:3px;white-space:nowrap;display:inline-block;margin-top:1px}
.chip.win{background:var(--good-soft);color:var(--good)}
.chip.loss{background:var(--crit-soft);color:var(--crit)}
.chip.opp{background:var(--gold-soft);color:var(--gold-ink)}
.chip.stopper{background:var(--crit);color:var(--on-brand)}
.chip.offtrack{background:var(--gold-soft);color:var(--gold-ink)}
.chip.risk{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.tab{background:var(--sunk);color:var(--ink-2)}

.proj{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;padding:8px 6px 8px 10px;background:var(--surface-2);border-radius:5px}
.proj .meta{font-size:13px;color:var(--muted)}
.proj .meta a{color:var(--gold-ink);font-weight:600}
.proj.done-row .it-t{text-decoration:line-through;color:var(--muted)}
.stat{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;background:var(--surface)}
.stat button{border:0;background:transparent;padding:5px 10px;font:600 12.5px var(--f-label);letter-spacing:.04em;color:var(--muted);border-left:1px solid var(--line)}
.stat button:first-child{border-left:0}
.stat button[aria-pressed="true"][data-v="on"]{background:var(--good-soft);color:var(--good)}
.stat button[aria-pressed="true"][data-v="off"]{background:var(--gold-soft);color:var(--gold-ink)}
.stat button[aria-pressed="true"][data-v="done"]{background:var(--ink);color:var(--on-ink)}
.stat button[aria-pressed="true"][data-v="hold"]{background:var(--sunk);color:var(--ink)}
.stat button[aria-pressed="true"][data-v="cancelled"]{background:var(--crit-soft);color:var(--crit)}
.proj{grid-template-columns:minmax(0,1fr) auto!important;align-items:start!important}
.proj .stat{grid-column:1 / -1;justify-self:start;flex-wrap:wrap}
.pname{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.pname:hover .it-t{text-decoration:underline}
.proj.sel{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.proj.ps-hold .it-t,.proj.ps-cancelled .it-t{color:var(--muted)}
.proj.ps-cancelled .it-t{text-decoration:line-through}
.proj.ps-new{box-shadow:inset 0 0 0 1px var(--gold)}
.proj.ps-new.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.warnt{color:var(--gold-ink);font-weight:600}
.chip.new{background:var(--gold);color:var(--on-brand);padding:3px 6px}
.why.fwd span{color:var(--gold-ink)}
.moved{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.moved ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.moved li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;font-size:14px;color:var(--ink-2)}
.moved .mv-a{grid-column:2;font-size:12.5px;color:var(--muted)}
.psel{box-shadow:inset 0 0 0 2px var(--brand)}
.psel-n{font-weight:700;margin:-4px 0 8px}
@media (max-width:560px){.proj{grid-template-columns:minmax(0,1fr) auto}.proj .stat{grid-column:1 / -1;justify-self:start}}

.issue{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.issue + .issue{margin-top:10px}
.issue.stop{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.issue.resolved{opacity:.7}
.issue.resolved .it-t{text-decoration:line-through}
.is-h{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:start}
.rank{font:600 16px/1.35 var(--f-mono);min-width:28px}
.is-h .it-t{font-size:15.5px}
.is-tools{display:flex;gap:4px;align-items:center}
.mv{width:26px;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:4px;color:var(--ink-2);font-size:10.5px;line-height:1;padding:0}
.mv:hover:not(:disabled){border-color:var(--ink)}
.mv:disabled{opacity:.3;cursor:default}
.is-sub{font-size:13px;color:var(--muted);margin:2px 0 8px 38px}
.is-body{margin-left:38px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
@media (max-width:560px){.is-sub,.is-body{margin-left:0}.is-h{grid-template-columns:auto minmax(0,1fr)}.is-h .chip{grid-column:2}.is-h .it-t,.is-h .is-tools{grid-column:1 / -1}}
.acts{list-style:none;margin:0;padding:0;width:100%}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:7px 0;border-top:1px dashed var(--line)}
.act:first-child{border-top:0}
.act input[type="checkbox"]{width:16px;height:16px;accent-color:var(--good);margin:3px 0 0}
.act .a-t{overflow-wrap:anywhere}
.act .a-t .aid{margin-right:6px}
.act .a-m{grid-column:2;font-size:12.5px;color:var(--muted)}
.act .a-m b{color:var(--ink-2);font-weight:600}
.act.done .a-t{text-decoration:line-through;color:var(--muted)}
.aid{font:500 11.5px var(--f-mono);color:var(--faint);white-space:nowrap}
.duetag{font:500 11.5px var(--f-mono);white-space:nowrap;padding:2px 6px;border-radius:3px;color:var(--ink-2);background:var(--surface-2)}
.duetag.over{background:var(--crit-soft);color:var(--crit)}
.duetag.soon{background:var(--gold-soft);color:var(--gold-ink)}
.duetag.done{background:var(--good-soft);color:var(--good)}
.noact{font-size:13.5px;color:var(--gold-ink)}

/* forms */
.add{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px}
.add input[type="text"],.add input[type="date"],.add select{height:34px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:0 9px;min-width:0}
.add input[type="text"]{flex:1 1 180px}
.add input.full{flex-basis:100%}
.add input[type="date"]{flex:0 0 146px;font-family:var(--f-mono);font-size:13px}
.add select{flex:0 1 190px}
.add select.full{flex:1 1 100%}
.add .ifloss{flex-basis:100%}
/* due check */
.duechk{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:10px 14px;margin-bottom:14px;background:var(--surface-2)}
.duechk.clear{border-left-color:var(--good);padding:8px 14px;font-size:14px;color:var(--ink-2)}
.duechk.clear b{font:700 12.5px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.duechk .dc-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:4px}
.duechk .dc-h b{font:700 12.5px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.duechk .dc-h span{font-size:12.5px;color:var(--muted)}
.duechk .act{grid-template-columns:auto minmax(0,1fr) auto}
.duechk .act input[type="date"]{height:28px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:0 6px;font:12.5px var(--f-mono);grid-row:1 / span 2;grid-column:3;align-self:center}
.duechk .dc-tip{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
/* summary */
.sumbox{margin-top:12px}
.sumbox textarea{width:100%;min-height:220px;font:12.5px/1.5 var(--f-mono);border:1px solid var(--line-strong);border-radius:4px;background:var(--surface-2);padding:8px 10px;resize:vertical;color:var(--ink)}
.stg-f .fr{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.add .acts-r{display:flex;gap:6px;margin-left:auto}
.add input::placeholder,textarea::placeholder{color:var(--faint)}
.tgl{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;height:34px;flex:none;position:relative;background:var(--surface)}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl label{padding:0 12px;display:grid;place-items:center;font:600 13px var(--f-label);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;color:var(--ink-2)}
.tgl input:checked + label{background:var(--ink);color:var(--on-ink)}
.tgl input:focus-visible + label{outline:2px solid var(--brand);outline-offset:-2px}

/* conclusion */
.concl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px 28px}
@media (max-width:700px){.concl{grid-template-columns:minmax(0,1fr)}}
.rates .lbl{margin:12px 0 2px}
.rates .lbl:first-child{margin-top:0}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.rrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate{display:flex;gap:4px;flex:none}
.rb{width:31px;height:31px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);font:500 13px var(--f-mono);padding:0}
.rb:hover{border-color:var(--ink)}
.rb[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.scale{font-size:12.5px;color:var(--muted);margin-top:8px}
.score .big{font:500 48px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.score .big small{font-size:18px;color:var(--muted)}
.spark{width:100%;max-width:260px;height:auto;display:block;margin-top:12px}
.spark .sg{stroke:var(--line);stroke-width:1}
.spark .sl{stroke:var(--brand);stroke-width:2;fill:none;stroke-linejoin:round}
.spark .se{fill:var(--brand)}
.spark .st{fill:var(--muted);font:10px var(--f-mono)}
textarea.fld{display:block;width:100%;min-height:62px;padding:8px 10px;height:auto;resize:vertical;margin-top:6px}

/* rail */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
@media (max-width:1150px){.rail{position:static}}
.rail .panel{padding:14px 16px}
.rail .pan-h{margin-bottom:8px}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{border-top:1px solid var(--line)}
.rlist li:first-child{border-top:0}
.rlist .act{border-top:0}
.ri{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 2px;align-items:start}
.ri:hover .it-t{text-decoration:underline}
.ri .rank{font-size:13px;min-width:22px}
.ri .it-t{font-size:14px}
.ri .m{grid-column:2;font-size:12px;color:var(--muted)}
.more{display:block;margin-top:8px;font-size:13px}

/* action register */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{height:30px;padding:0 12px;border:1px solid var(--line-strong);border-radius:15px;background:var(--surface);font:500 13.5px var(--f-body);display:inline-flex;align-items:center;gap:6px}
.fchip b{font:500 12px var(--f-mono);color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.fchip[aria-pressed="true"] b{color:inherit;opacity:.75}
.fchip.crit b{color:var(--crit)}
.fchip.crit[aria-pressed="true"] b{color:inherit}
.filters select{height:30px;border:1px solid var(--line-strong);border-radius:15px;background:var(--surface);padding:0 10px;font-size:13.5px}
.filters .sp{flex:1 1 auto}
.alist{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.arow > input[type="checkbox"]{margin-top:4px;width:16px;height:16px;accent-color:var(--good)}
.arow .atext{font-weight:500;overflow-wrap:anywhere}
.arow .atext .aid{margin-right:7px}
.arow .ameta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.arow .ameta b{font-weight:600;color:var(--ink-2)}
.arow.done .atext{text-decoration:line-through;color:var(--muted)}
.adue{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.adue input{height:30px;width:136px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);font:12.5px var(--f-mono);padding:0 6px}
.arow.over .adue input{border-color:var(--crit)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--brand-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--brand)}}
@media (max-width:560px){.arow{grid-template-columns:auto minmax(0,1fr) auto}.adue{grid-column:2;align-items:flex-start;flex-direction:row}}
.follow textarea{width:100%;min-height:170px;font:12.5px/1.5 var(--f-mono);border:1px solid var(--line-strong);border-radius:4px;background:var(--surface-2);padding:8px 10px;resize:vertical;color:var(--ink)}
.follow .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.scope-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:var(--brand-soft);border-radius:4px;padding:6px 10px}

/* timeline */
.tl-scroll{overflow-x:auto}
.tl{display:grid;grid-template-columns:170px 80px minmax(440px,1fr) 60px;min-width:760px}
.tl > div{border-top:1px solid var(--line);min-height:46px;position:relative}
.tl .ax{border-top:0;min-height:22px;font:600 11px var(--f-label);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:flex-end;padding-bottom:4px}
.tl-lab{padding:7px 10px 6px 0;display:flex;flex-direction:column;justify-content:center;line-height:1.2;min-width:0}
.tl-lab b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-over{background:var(--crit-soft);display:flex;flex-wrap:wrap;align-content:center;gap:4px;padding:6px 8px}
.tl-over.ax{background:transparent;color:var(--crit);padding:0 8px 4px}
.tl-later{display:flex;align-items:center;justify-content:center;font:12px var(--f-mono);color:var(--muted);border-left:1px dashed var(--line)}
.tl-later.ax{border-left:0}
.tl-in{position:absolute;inset:0 12px}
.gl{position:absolute;top:0;bottom:0;width:0;border-left:1px dotted var(--line-strong)}
.gl.today{border-left:1.5px solid var(--ink)}
.tk{position:absolute;bottom:4px;transform:translateX(-50%);font:500 11px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap}
.dot{position:absolute;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ink-2);border:2px solid var(--surface);padding:0;box-shadow:0 0 0 1px var(--ink-2)}
.dot.soon{background:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.dot.over{position:static;margin:0;background:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.dot.proj{border-radius:1px;transform:rotate(45deg);background:var(--surface);box-shadow:0 0 0 2px var(--ink-2);width:10px;height:10px;margin-left:-5px}
.dot.proj.off{box-shadow:0 0 0 2px var(--gold);background:var(--gold-soft)}
.dot.proj.over{background:var(--crit-soft);box-shadow:0 0 0 2px var(--crit)}
.dot:hover{z-index:2;outline:2px solid var(--brand);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:-1px;margin-right:5px}
.lg-a{width:10px;height:10px;border-radius:50%;background:var(--ink-2)}
.lg-s{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.lg-o{width:10px;height:10px;border-radius:50%;background:var(--crit)}
.lg-t{width:0;height:12px;border-left:1.5px solid var(--ink)}
.lg-p{width:8px;height:8px;transform:rotate(45deg);border:2px solid var(--ink-2)}
.tl-empty{grid-column:1 / -1;border-top:1px solid var(--line);padding:14px 0;color:var(--muted)}
.seg-tgl{display:inline-flex;border:1px solid var(--line-strong);border-radius:15px;overflow:hidden}
.seg-tgl button{border:0;background:var(--surface);padding:4px 12px;font-size:13px}
.seg-tgl button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

/* tables (people, settings) */
.tbl-scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{font:700 11.5px var(--f-label);text-transform:uppercase;letter-spacing:.08em;background:var(--brand);color:var(--on-brand);text-align:left;padding:8px 10px;white-space:nowrap}
table.t th:first-child{border-top-left-radius:4px} table.t th:last-child{border-top-right-radius:4px}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr:nth-child(even) td{background:var(--surface-2)}
table.t .k{font-size:12.5px;color:var(--muted)}
table.t input.fld{width:100%;height:32px}
table.t td.c{text-align:center;width:96px}
table.t input[type="radio"]{width:16px;height:16px;accent-color:var(--brand);margin:0}
.mchips{display:flex;flex-wrap:wrap;gap:4px}
.mchips .pchip{font-size:12px;padding:1px 8px}
.sgrid{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end}
.sgrid > div{display:flex;flex-direction:column;gap:5px}
.sgrid .fld.w{width:280px;max-width:100%}
.sgrid .fld.n{width:90px;font-family:var(--f-mono)}

.ro .edit-only{display:none!important}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:9px 12px 9px 16px;border-radius:5px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:50;max-width:calc(100vw - 32px)}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:4px;padding:2px 9px;font:600 12.5px var(--f-label);text-transform:uppercase}
</style>

  /* ---------- meeting ---------- */
  function renderMeeting(t) {

  function stageHead(i, extra) {

  function entryItem(e) {

  }
  function actRow(a, withMeeting) {
    var c = dueCls(a);
    return '<li class="act ' + c + '" id="ra-' + a.id + '"><input type="checkbox" id="c-' + a.id + '" data-edit="actionDone" data-id="' + a.id + '"' + (isOpen(a) ? '' : ' checked') + DIS() + ' aria-label="Mark ' + aid(a) + ' done">' +

  /* one action form, used everywhere: o = { tid, d, rel, pickTab, style } */
  function actionForm(key, o) {
    var k = String(key).replace(/[^a-z0-9]/gi, '-'), tid = o.tid;
    var tabField = o.pickTab ? '<select id="f-a-tab-' + k + '" name="tab" data-edit="actTab" aria-label="Meeting">' + state.tabs.map(function (t) { return '<option value="' + t.id + '"' + (t.id === tid ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') + '</select>' : '<input type="hidden" name="tab" value="' + esc(tid) + '">';
    return '<form class="add edit-only" data-form="action"' + (o.style ? ' style="' + o.style + '"' : '') + '>' +
      '<input type="text" class="full" id="f-a-text-' + k + '" name="text" placeholder="What’s the action?" required aria-label="Action">' +
      '<select id="f-a-own-' + k + '" name="owner" required aria-label="Owner (one person)">' + nameOpts('', 'Owner…', tid) + '</select>' +
      '<select id="f-a-sup-' + k + '" name="support" aria-label="Support from">' + nameOpts('', 'Support from…', tid) + '</select>' + tabField +
      '<select class="full" id="f-a-rel-' + k + '" name="rel" aria-label="Related to">' + relOpts(tid, o.rel || '') + '</select>' +
      '<input type="date" id="f-a-due-' + k + '" name="due" value="' + addDays(o.d || TODAY, 7) + '" required aria-label="Due date">' + formEnd('Add action') + '</form>';
  }
  function dueCheck(t, d) {
    var prev = addDays(d, -7);
    var list = state.actions.filter(function (a) {
      if (a.tab !== t.id || !a.due || a.due > d) return false;
      return isOpen(a) || (a.due > prev && a.doneOn && a.doneOn > prev);
    }).sort(function (a, b) { return isOpen(a) !== isOpen(b) ? (isOpen(a) ? -1 : 1) : (a.due < b.due ? -1 : a.due > b.due ? 1 : a.num - b.num); });
    if (!list.length) return '<div class="duechk clear"><b>Due since last meeting</b> · Nothing came due. Start the round.</div>';
    var nOpen = list.filter(isOpen).length;
    return '<div class="duechk"><div class="dc-h"><b>Due since last meeting</b><span>' + fmt(addDays(prev, 1)) + ' – ' + fmt(d) + ' · ' + (nOpen ? nOpen + ' still open' : 'all closed') + (list.length - nOpen ? ' · ' + (list.length - nOpen) + ' done' : '') + '</span></div>' +
      '<ul class="acts">' + list.map(function (a) {

          '<span class="a-t"><span class="aid">' + aid(a) + '</span>' + esc(a.text) + ' <span class="duetag ' + c + '">' + dueLabel(a) + '</span></span>' +
          (isOpen(a) ? '<input type="date" id="dc-d-' + a.id + '" data-edit="actionDue" data-id="' + a.id + '" value="' + esc(a.due) + '" aria-label="Move the due date for ' + aid(a) + '"' + DIS() + '>' : '<span></span>') +
          '<span class="a-m"><b>' + esc(a.owner || 'No owner') + '</b>' + (a.support ? ' · with ' + esc(a.support) : '') + (pt ? ' · ' + esc(pt) : '') + '</span></li>';
      }).join('') + '</ul>' +
      (nOpen ? '<p class="dc-tip">Check off what’s done. Anything slipping gets a new date, and the owner says why in the round.</p>' : '') + '</div>';
  }
  function meetingSummary(t, d) {
    var r = ratingInfo(t.id, d), total = attendeeIds(t).filter(P).length, mt = state.meetings[mkey(t.id, d)] || {};
    var ents = state.entries.filter(function (e) { return e.tab === t.id && e.meeting === d; });
    var L = [], wl = ents.filter(function (e) { return e.kind === 'win' || e.kind === 'loss'; }), opps = ents.filter(function (e) { return e.kind === 'opp'; });
    function sec(title, lines, empty) { L.push('', title.toUpperCase()); if (lines.length) lines.forEach(function (x) { L.push('• ' + x); }); else L.push('• ' + empty); }
    L.push(t.name + ' · ' + fmtLong(d));
    L.push('Meeting score: ' + (r.n ? r.avg.toFixed(1) + ' / 5 (' + r.n + ' of ' + total + ' rated)' : 'not rated'));
    sec('Wins & losses', wl.map(function (e) { return (e.kind === 'win' ? 'Win' : 'Loss') + ' · ' + pn(e.personId) + ': ' + e.text + (e.why ? '. Why: ' + e.why : '') + (e.change ? (e.kind === 'loss' ? '. Doing differently: ' : '. Keep doing: ') + e.change : ''); }), 'None recorded');
    sec('New opportunities', opps.map(function (e) { var pj = e.projectId ? byId(state.projects, e.projectId) : null; return pn(e.personId) + ': ' + e.text + (e.why ? ' (challenge: ' + e.why + ')' : '') + (pj && pj.start ? '. Joins Current Projects ' + fmtDay(pj.start) : ''); }), 'None');

    });
    var still = state.projects.filter(function (x) { return x.tab === t.id && x.status === 'off' && x.statusMeeting !== d; }).map(function (x) { return x.name; });
    if (still.length) chg.push('Still off track: ' + still.join(', '));
    sec('Project status changes', chg, 'No changes');
    var na = state.actions.filter(function (a) { return a.tab === t.id && a.meeting === d; }).sort(function (a, b) { return a.num - b.num; });
    sec('New actions', na.map(function (a) { var pt = parentText(a); return aid(a) + ' ' + a.text + ' · Owner: ' + (a.owner || 'none') + (a.support ? ' (with ' + a.support + ')' : '') + ' · Due ' + (a.due ? fmtDay(a.due) : 'no date') + (pt ? ' · Re: ' + pt : '') + (isOpen(a) ? '' : ' · DONE'); }), 'None');

  function renderStage(t, step, d, ents) {

        var p = P(pid), mine = list.filter(function (e) { return e.personId === pid; }), key = (step === 0 ? 'wl:' : 'opp:') + pid;

            '<form class="add edit-only" data-form="wl" data-pid="' + pid + '"><span class="tgl" role="radiogroup" aria-label="Win or loss"><input type="radio" name="kind" id="f-wl-win-' + pid + '" value="win" data-edit="wlKind" checked><label for="f-wl-win-' + pid + '">Win</label><input type="radio" name="kind" id="f-wl-loss-' + pid + '" value="loss" data-edit="wlKind"><label for="f-wl-loss-' + pid + '">Loss</label></span>' +
